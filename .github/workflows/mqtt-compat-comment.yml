name: MQTT Compatibility Comment

# Companion to "MQTT Compatibility" (mqtt-compat.yml). That workflow runs on
# pull_request with a read-only token so it can safely execute untrusted fork
# code — which is exactly why it cannot post a PR comment (fork PRs get a
# read-only GITHUB_TOKEN and the API call would 403).
#
# This workflow closes that gap the fork-safe way: it triggers on workflow_run
# once the compat run completes, executes only trusted base-repo code, and so is
# granted pull-requests: write. It NEVER checks out or runs any PR code — the only
# thing crossing the trust boundary is the report.md comment body downloaded from
# the compat run's artifact; the target PR is resolved from trusted workflow_run
# metadata, never from the (untrusted) artifact.
#
# Note: this file always runs from the repository's default branch, so edits to
# the commenting logic only take effect once merged there — not from within a PR
# that changes this file.

on:
  workflow_run:
    workflows: ["MQTT Compatibility"]
    types: [completed]

permissions:
  contents: read
  actions: read # download the artifact from the triggering run
  pull-requests: write # post/update the sticky comment

# Serialize comment runs per PR source (repo + branch), not per compat run id:
# keying on the run id would make every group a singleton, so a stale comment
# job could overwrite a newer one. Keying on the PR's identity lets a newer
# compat run's comment job cancel an older one still in flight. head_repository +
# head_branch uniquely identify the PR source (the same pair the job resolves the
# PR number from).
concurrency:
  group: mqtt-compat-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post compatibility comment
    runs-on: ubuntu-latest
    # Only comment for compat runs triggered by a pull request (pushes and manual
    # dispatches have no PR to post to), and skip runs the parent cancelled — a
    # superseded compat run has nothing worth posting. Genuine failures still
    # comment, so a failing report reaches the PR.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      # Checks out the default branch (trusted), never the PR head — needed only
      # to make the local ./.github/actions/sticky-pr-comment composite available.
      - uses: actions/checkout@v7

      - name: Download compat result
        uses: actions/download-artifact@v7
        with:
          name: mqtt-compat-result
          path: compat-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Resolve which PR to comment on from the TRUSTED workflow_run head metadata,
      # never from the artifact: the artifact is built by the untrusted compat job
      # that runs fork code, so a poisoned pr-number could retarget the comment
      # (posted under the bot's write token) at any issue/PR in the repo. Instead
      # we look the PR up by its head repo:branch and confirm head_sha matches the
      # run, then bail if there's no match or no report to post.
      - name: Resolve comment inputs
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('compat-result/report.md')) {
              core.info('No report.md in artifact; nothing to post.');
              core.setOutput('ready', 'false');
              return;
            }
            const run = context.payload.workflow_run;
            const headOwner = run.head_repository?.owner?.login;
            const headBranch = run.head_branch;
            const headSha = run.head_sha;
            if (!headOwner || !headBranch || !headSha) {
              core.info('Missing workflow_run head metadata; nothing to post.');
              core.setOutput('ready', 'false');
              return;
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${headOwner}:${headBranch}`,
              per_page: 100,
            });
            const pr = prs.find(p => p.head.sha === headSha);
            if (!pr) {
              core.info(`No PR matches ${headOwner}:${headBranch}@${headSha}; nothing to post.`);
              core.setOutput('ready', 'false');
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('ready', 'true');

      - name: Sticky PR comment
        if: steps.resolve.outputs.ready == 'true'
        uses: ./.github/actions/sticky-pr-comment
        with:
          file: compat-result/report.md
          tag: "<!-- MQTT_COMPAT_COMMENT -->"
          pr-number: ${{ steps.resolve.outputs.number }}
